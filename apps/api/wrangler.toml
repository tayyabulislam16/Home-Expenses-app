name = "home-expense-api"
account_id = "035db82bb3edb8595758e52edaa78729"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "expense_db"
database_id = "cccd0d8e-a0b7-4465-a469-96f860a0a542"
migrations_dir = "migrations"

# R2 disabled until enabled in Cloudflare dashboard.
# Go to https://dash.cloudflare.com → R2 → "Enable R2", then create the bucket:
#   npx wrangler r2 bucket create home-expense-receipts
# and uncomment the binding below.
# [[r2_buckets]]
# binding = "RECEIPTS"
# bucket_name = "home-expense-receipts"

[vars]
WEB_ORIGIN = "https://legerly.pages.dev,https://staging.legerly.pages.dev,http://localhost:8081"
BETTER_AUTH_URL = "https://home-expense-api.legerly.workers.dev"

# Set with: wrangler secret put BETTER_AUTH_SECRET
# wrangler secret put GOOGLE_CLIENT_ID
# wrangler secret put GOOGLE_CLIENT_SECRET
