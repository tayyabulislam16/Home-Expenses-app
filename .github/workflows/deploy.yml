name: Deploy

on:
  push:
    branches: [main, staging]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  CLOUDFLARE_ACCOUNT_ID: 035db82bb3edb8595758e52edaa78729
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  deploy-api:
    name: Deploy Worker (API)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci --legacy-peer-deps
      - run: npx wrangler deploy
        working-directory: apps/api

  deploy-web:
    name: Deploy Web (Pages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci --legacy-peer-deps
      - name: Build web
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_API_URL: https://home-expense-api.legerly.workers.dev
        run: npx expo export -p web
      - name: Deploy to Cloudflare Pages
        working-directory: apps/mobile
        run: npx wrangler pages deploy dist --project-name=legerly --branch=${{ github.ref_name }} --commit-dirty=true
